name: Build, Test & Release on Tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  test-and-release:
    name: Test (>=75% Coverage) & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Run Vitest with Coverage Gate (>= 75%)
        run: pnpm run test:coverage

      - name: Sync Version from Tag & Package VSIX
        id: version_step
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CLEAN_VER="${TAG_NAME#v}"
          if [[ "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version='$CLEAN_VER'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)+'\n');"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          pnpm run package

      - name: Create GitHub Release & Upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "CommitPro ${{ steps.version_step.outputs.tag }}"
          generate_release_notes: true
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
